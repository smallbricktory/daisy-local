[package]
name = "recording"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[example]]
name = "live_aec_replay"
path = "../../diagnostics/audio/live_aec_replay.rs"

[dependencies]
audio-engine = { path = "../audio-engine" }
aec = { path = "../aec" }
denoise = { path = "../denoise" }
providers-realtime = { path = "../providers-realtime" }
transcript = { path = "../transcript" }
syncsafe = { path = "../syncsafe" }
system-sleep = { path = "../system-sleep" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
opus.workspace = true
ogg.workspace = true
log.workspace = true
tokio.workspace = true
uuid = { workspace = true }
rayon.workspace = true
symphonia.workspace = true
sysinfo = "0.33"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
