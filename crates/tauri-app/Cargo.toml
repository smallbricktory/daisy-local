[package]
name = "tauri-app"
version = "1.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "tauri_app_core"
path = "src/lib.rs"

[[bin]]
name = "daisy-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
recording = { path = "../recording" }
syncsafe = { path = "../syncsafe" }
summarize = { path = "../summarize" }
daisy-llm-protocol = { path = "../daisy-llm-protocol" }
transcript = { path = "../transcript" }
providers-http = { path = "../providers-http" }
providers-local = { path = "../providers-local" }
providers-realtime = { path = "../providers-realtime" }
audio-engine = { path = "../audio-engine" }
embeddings = { path = "../embeddings" }
voiceprints = { path = "../voiceprints" }
vault = { path = "../vault" }
license = { path = "../license" }
uuid.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
fern.workspace = true
chrono.workspace = true
whisper-rs = { workspace = true }
directories.workspace = true
rayon.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tokio.workspace = true
walkdir.workspace = true
reqwest.workspace = true
hound.workspace = true
sysinfo = "0.33"
base64.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
rcgen.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
ble = { path = "../ble" }
hmac.workspace = true
subtle.workspace = true
if-addrs.workspace = true
rand.workspace = true
sha2.workspace = true
axum.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
futures-util.workspace = true
tauri-plugin-clipboard-manager = "2.3.2"
# UI-test harness plugins; compiled only with `--features ui-test`.
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
# Native "already running" dialog for the single-instance guard. It fires before
# the webview exists, so it can't be the in-app themed UI — a native OS dialog is
# the best available, on every platform. rfd is already in the tree via
# tauri-plugin-dialog, which selects the backend (gtk3 on Linux, native on
# win/mac). default-features = false so we DON'T also pull rfd's xdg-portal
# backend — rfd refuses gtk3 + xdg-portal together.
rfd = { version = "0.16", default-features = false }

# Linux-only: webkit2gtk drives Tauri's webview on Linux (via wry). We poke
# its settings to enable getUserMedia and auto-grant the
# UserMediaPermissionRequest so the in-app mic-level meters work.
# Version must match what wry uses internally — see Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# Used by telemetry.rs sysconf calls (_SC_CLK_TCK, _SC_PAGESIZE) for CPU%
# computation from /proc/self/stat.
libc = "0.2"

# perf.rs reads free/inactive/purgeable page counts via host_statistics64
# for the available-memory figure; hardware.rs reads the machine-local
# LocalHostName (SystemConfiguration) so the settings key survives a network
# change, and IOKit power sources for has_battery().
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
# hardware::reduce_transparency() reads NSWorkspace's accessibility display
# options: WebKit exposes macOS Reduce Transparency to no media query.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

# hardware::has_battery() uses GetSystemPowerStatus to detect laptops.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power"] }
# Direct MachineGuid read for the machine-mode vault key — a `powershell`
# spawn at startup is slow and can race the vault auto-unlock.
winreg = "0.55"


[features]
# Enable Tauri's `custom-protocol` so release builds serve the embedded
# frontendDist via the `tauri://` scheme. Without this, tauri-build sets
# cfg(dev) on every build and the webview tries to load http://localhost:5173,
# which only exists when Vite is running. `cargo tauri build` sets this for
# you; plain `cargo build --release --features custom-protocol` needs the flag
# (or make this a default feature, but then `cargo tauri dev` would have to
# disable it explicitly).
custom-protocol = ["tauri/custom-protocol"]
# In-app WebDriver server + execute/mock bridge for the e2e suite. Never
# enabled for shipping builds.
ui-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "license/ui-test"]
# Whisper GPU/BLAS backends are per-platform target dependencies in
# providers-local/Cargo.toml; see that file for the build-time requirements.

[dev-dependencies]
# The integration tests drive the first-run commands, which read the
# per-machine config directory. `ui-test` is what makes DAISY_CONFIG_DIR
# redirect it; dev dependencies are not compiled for shipping builds, so the
# override stays out of them.
license = { path = "../license", features = ["ui-test"] }
# `tauri::test::mock_app` — the commands that take an `AppHandle` (the MCP
# server, the recordings sweep) cannot be driven without a runtime.
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
env_logger.workspace = true
mockito.workspace = true
