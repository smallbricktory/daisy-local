[package]
name = "voiceprints"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json.workspace = true
# For the diagnostics examples (WAV loading via transcript::wav_io).
transcript = { path = "../transcript" }

# Diagnostic/analysis tools live in the repo-root `diagnostics/` folder (kept
# separate from shippable code), wired here as examples so they stay buildable:
#   cargo run --release -p voiceprints --example denoise_diar_ab -- <session_dir>
[[example]]
name = "denoise_diar_ab"
path = "../../diagnostics/speakers/denoise_diar_ab.rs"

[[example]]
name = "diag_diarize"
path = "../../diagnostics/speakers/diag_diarize.rs"

[[example]]
name = "probe_vp"
path = "../../diagnostics/speakers/probe_vp.rs"

[[example]]
name = "probe_diarize_mic"
path = "../../diagnostics/speakers/probe_diarize_mic.rs"

[[example]]
name = "cluster_split"
path = "../../diagnostics/speakers/cluster_split.rs"

[[example]]
name = "dump_turns"
path = "../../diagnostics/speakers/dump_turns.rs"

[[example]]
name = "time_speakrs"
path = "../../diagnostics/speakers/time_speakrs.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
ort.workspace = true
ndarray.workspace = true
hound.workspace = true
rustfft.workspace = true
num-complex.workspace = true
# Speakrs-backed diarization (pyannote community-1 pipeline). `online` (HF
# download) is OFF — models ship bundled (SPEAKRS_MODELS_DIR), so from_dir is the
# only loader and hf-hub isn't pulled in. Keep default-linalg (BLAS backend:
# intel-mkl-static x86_64 / openblas-static aarch64). ExecutionMode is chosen
# per-platform in speakrs_diar.rs.
speakrs = { version = "0.4", default-features = false, features = ["default-linalg"] }

# macOS: also enable native CoreML (ANE/GPU). Cargo unions features across the
# base + this entry; objc2 deps stay off Linux/Windows.
[target.'cfg(target_os = "macos")'.dependencies]
speakrs = { version = "0.4", default-features = false, features = ["default-linalg", "coreml"] }
