# SPDX identifiers Daisy is willing to ship. Anything outside this list
# fails `cargo about generate` so we don't accidentally ship a copyleft dep.
accepted = [
    "Elastic-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# Some crates ship without a license file but their license is well-known.
# (We do this only for clear-cut cases; anything ambiguous should fail.)
[ring]
accepted = ["ISC", "MIT", "OpenSSL"]

# The webrtc-audio-processing family declares `license-file = "COPYING"`
# (the standard WebRTC BSD-3-Clause text) instead of an SPDX field, and
# cargo-about's file scan then trips over obscure permissive notices inside
# the bundled C++ tree. Pin them to what COPYING actually says.
[webrtc-audio-processing.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "6db9d4840c6ff0fb3c37ace8e32cfd3eb6c6e759c67b4ecbee969cd8d75154a9"

[webrtc-audio-processing-config.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-config.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"

[webrtc-audio-processing-sys.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-sys.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"
