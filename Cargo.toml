[workspace]
members = ["crates/*"]
# Vendored crates build as path dependencies; excluding them lets their own test
# suites run from their directory:
#   cd vendor/speakrs && CARGO_TARGET_DIR=../../target/vendor cargo test --lib
exclude = ["vendor/speakrs", "vendor/webrtc-audio-processing-sys"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Elastic-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
# Ogg-Opus mixdown codec.
# `opus` = MIT/Apache-2.0 bindings to libopus (BSD-3-Clause). `ogg` = BSD-3-Clause muxer.
opus = "0.3"
ogg = "0.9"
# GPU/BLAS accel is per-platform — see the target-specific whisper-rs entries
# in crates/providers-local/Cargo.toml (metal on macOS, vulkan+openblas on
# Linux, vulkan on Windows).
# `log_backend` redirects whisper.cpp + ggml stderr noise (whisper_init_state /
# whisper_backend_init lines, dozens per Whisper invocation) into the Rust `log`
# crate, where the dual-sink dispatcher in tauri-app filters them out of the
# console and dumps them in the per-session log file at DEBUG.
whisper-rs = { version = "0.16", features = ["log_backend"] }
pipewire = "0.10"
log = "0.4"
# env_logger serves daisy-cli + test fixtures (audio-engine, recording) only;
# the daisy-app binary uses fern (below) for the dual-sink dispatcher and does
# not link env_logger.
env_logger = "0.11"
# fern: dual-sink log dispatcher for daisy-app (console = WARN+, file =
# INFO+ / DEBUG+ when debug_logging is set); INFO-level engine chatter lands
# in the rotating <profile>/logs/daisy.log, not the terminal.
fern = { version = "0.7", features = ["date-based"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# ONNX Runtime for voiceprints (WeSpeaker) and embeddings (Q&A).
# `download-binaries` fetches a prebuilt libonnxruntime at build time and
# places it next to the binary (Linux: target/<profile>/libonnxruntime.so —
# repack-appimage.sh bundles it; Windows: build-release.ps1 copies the DLL).
# `ort` must remain the workspace's sole ORT provider: a dependency shipping
# its own static ONNX Runtime collides with `download-binaries` at link time.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "api-24", "tls-rustls"] }
ndarray = "0.17"
# WebRTC AEC3 (audio processing module) — the software echo canceller behind
# the mic_voice_processed seam. `bundled` builds the C++ statically via meson +
# ninja (build-time deps on all three platforms); the sys crate is vendored
# with MSVC fixes, see [patch.crates-io].
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"] }
# DeepFilterNet3 noise suppression (finalize-only mic denoise → opus + diarize).
# Git-pinned: crates.io's deep_filter is stale 0.2.5; repo master is 0.5.7-pre.
# tract feature = pure-Rust ONNX inference (compile-time dep, nothing to ship).
# default-model-LL embeds the ~36 MB DFN3 *low-latency* model: under the only
# tract version deep_filter compiles against (=0.21.5, see crates/denoise),
# standard DFN3 fails tract's codegen ("duplicate name /convt3/Conv.bias") and
# DFN2 panics tract — DFN3-ll is the one variant that loads. Batch quality
# difference vs standard DFN3 is just reduced lookahead.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model-ll", "transforms"] }
# HuggingFace tokenizers (Rust impl), needed by the embedding model.
# `onig` feature avoids fancy-regex's binary-size hit; cross-platform.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
rustfft = "6"
num-complex = "0.4"
crossbeam-channel = "0.5"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "stream"] }
mockito = "1"
directories = "5"
# tray-icon: system tray. (No devtools feature — release builds ship without
# the WebView inspector.)
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
argon2 = "0.5"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rcgen = "0.13"
hkdf = "0.12"
hmac = "0.12"
subtle = "2"
if-addrs = "0.13"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
# Loopback MCP server (crates/tauri-app/src/mcp/) — HTTP layer only.
axum = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
zeroize = { version = "1", features = ["derive"] }
futures-util = "0.3"
async-trait = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3"
zxcvbn = "3"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1"
# Import decode for user-supplied audio (mp3/m4a-aac/flac/wav/ogg). MPL-2.0
# (weak, file-level copyleft — OK to ship proprietary). Decode-only; we still
# never *encode* MP3 (no GPL/LGPL encoder in the tree).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "wav", "pcm", "alac"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true       # drop debug symbols — smaller binary, fewer readable names

# Vendored speakrs with a one-line patch: cap ORT-CPU sessions to Level1
# graph-opt so the FBANK session doesn't fuse into FusedConv (whose kernel is
# missing from the app's ORT binary on macOS aarch64 -> crash). See
# vendor/speakrs/src/inference.rs.
[patch.crates-io]
speakrs = { path = "vendor/speakrs" }
# Vendored webrtc-audio-processing-sys 2.1.0 with the changes that make the
# bundled meson build work under MSVC: portable source copy, -Dcpp_std=c++20,
# `meson compile` instead of bare ninja (re-activates the VS environment),
# symbol prefixing skipped (nm/objcopy are ELF-only), static=absl_strings +
# winmm link, and WEBRTC_WIN in wrapper.cpp. The abseil source tarball is
# pre-seeded in webrtc-audio-processing/subprojects/packagecache/ (SHA-pinned
# by the .wrap) so `meson setup` never reaches the network.
webrtc-audio-processing-sys = { path = "vendor/webrtc-audio-processing-sys" }
